[project]
name = "day10-data-observability-lab-student"
version = "0.1.0"
description = "Student starter lab for Day 10 data pipeline, data observability, and RAG evaluation."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "chromadb>=0.4.0",
  "datasets>=2.0.0",
  "langchain>=0.1.0",
  "langchain-anthropic>=0.1.0",
  "langchain-google-genai>=1.0.0",
  "langchain-ollama>=0.1.0",
  "langchain-openai>=0.1.0",
  "pandas>=2.0.0",
  "python-dotenv>=1.0.1",
  "requests>=2.30.0",
  "sentence-transformers>=2.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
]

[build-system]
requires = ["setuptools>=80.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
